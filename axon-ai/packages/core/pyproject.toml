[project]
name = "axon-ai"
version = "0.7.0rc3"
description = "Runtime genérico da plataforma Axon (monolito modular; specs 002–009, 011, 012)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "axon-ai-contracts>=0.2.1,<0.3",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    # Spec 006 (research R4): camada compatível com OpenAI, confinada a axon_ai/llm/adapters/ por import-linter.
    "openai>=3.15,<4",
    # Spec 005 (research R1): framework de grafo, confinado a axon_ai/graph/adapters/langgraph/ por import-linter.
    "langgraph>=1.2,<2",
    # Spec 008: framework HTTP, confinado a axon_ai/http/adapters/ por import-linter.
    "fastapi>=0.141,<1",
    # Spec 011 (research R5): servidor ASGI do `axon serve`.
    "uvicorn>=0.53,<1",
    # Spec 003 (research R6): verificação local de JWT do OIDC, confinada a axon_ai/assistants/adapters/.
    "pyjwt[crypto]>=2.10,<3",
    # Spec 003 (research R6, R17): busca do JWKS. Já vinha pelo SDK da 006; explícita porque agora é usada direto.
    "httpx>=0.28,<1",
    # Spec 003 (research R8, ADR-015): driver e pool do Postgres, confinados aos adapters de cada módulo.
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    # Spec 007 (research R6): SDK oficial de MCP — traz httpx2/httpcore2 —, confinado a axon_ai/mcp/adapters/.
    "mcp>=2.2,<3",
    # Spec 012 (research R2): hash de senha argon2id, confinado a axon_ai/identity/adapters/ por import-linter. As wheels
    # `abi3` do argon2-cffi-bindings servem ao Python 3.14 e ao aarch64 do hardware alvo.
    "argon2-cffi>=25.1,<26",
    # Spec 009 (research R32): destino Langfuse por OpenTelemetry (OTLP/HTTP), confinado a axon_ai/observability/adapters/
    # por import-linter — o núcleo do trace nunca importa biblioteca de observabilidade (R1).
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.scripts]
axon = "axon_ai.bootstrap.cli:main"

[tool.uv.sources]
axon-ai-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
