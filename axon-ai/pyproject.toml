# Raiz virtual do uv workspace `axon-ai` (ADR-004): contracts, core e generic.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# O pack genérico entra como dependência de desenvolvimento: o teste de carga real roda na suíte do core (010 R8).
axon-generic = { workspace = true }

[dependency-groups]
dev = [
    "axon-generic",
    # Cliente de teste do framework HTTP (spec 008): a suíte exercita a app em processo, sem abrir porta.
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "packaging>=24",
    "import-linter>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    # Spec 012 (research R1): cliente OIDC (RP) da suíte de protocolo do provedor de identidade; só nos testes.
    "authlib>=1.8,<2",
]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "packages/core/tests", "packages/generic/tests"]
pythonpath = [
    "packages/contracts/tests",
    "packages/core/tests/packs",
    "packages/core/tests/observability",
    "packages/core/tests/llm",
    "packages/core/tests/graph",
    "packages/core/tests/http",
    "packages/core/tests/bootstrap",
    "packages/core/tests/assistants",
    "packages/core/tests/mcp",
    "packages/core/tests/capabilities",
    "packages/core/tests/eval",
    "packages/core/tests/identity",
]
asyncio_mode = "auto"
# Spec 007: uma marca por user story, para rodar `-k us1` … `-k us6` (tasks.md, "Independent Test").
markers = [
    "us1: 007 US1 — MCP global sem código nem restart",
    "us2: 007 US2 — credencial por referência; 005 US2 — flow agentic; 006 US2 — modelo por papel; 010 US2 — Assistant genérico com MCP; 009 US2 — harness",
    "us3: 007 US3 — cliente restrito ao grant; 006 US3 — providers externos e roteamento automático; 005 US3 — flow rag_first; 009 US3 — regressão em CI",
    "us4: 007 US4 — MCPs de usuário; 006 US4 — saída estruturada no controller; 005 US4 — validação no rag_first; 009 US4 — benchmark de modelos",
    "us5: 007 US5 — política por servidor; 006 US5 — allowlist de modelo; 009 US5 — uso e custo",
    "us6: 007 US6 — proteções de rede; 003 US6 — Assistants de usuário; 009 US6 — destino Langfuse",
    "us7: 009 US7 — captura opcional de prompt e resposta",
    "us8: 003 US8 — validação de Assistants; 009 US8 — identidade Axon (serviço e rótulo do selo); 012 US8 — identidade Axon (marca das páginas, cookie, realm e rótulos)",
    "us9: 003 US9 — administração por grupo, com token da plataforma ou chave",
    "us10: 003 US10 — sobreposições de Assistants de sistema; 008 US10 — identidade Axon (cabeçalhos, extensão, OpenAPI e instance.custom)",
    "us11: 003 US11 — identidade Axon (audiências e prefixo da chave); 008 US11 — chaves rotacionáveis e auth na administração",
    "us12: 003 US12 — rotação do segredo de chaves de API",
    "us13: 003 US13 — sobreposição de auth de Assistants de sistema",
]
asyncio_default_fixture_loop_scope = "function"
# estende os padrões do pytest; o pack de teste (fixtures/) roda no próprio ambiente limpo
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["axon_ai_contracts", "contract_test_pack", "axon_ai", "axon_generic"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/contracts/src", "packages/contracts/tools", "packages/core/src", "packages/generic/src"]

[tool.importlinter]
root_packages = ["axon_ai_contracts", "axon_ai", "axon_generic"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contratos não dependem de frameworks do runtime"
type = "forbidden"
source_modules = ["axon_ai_contracts"]
forbidden_modules = ["langgraph", "langchain", "fastapi", "qdrant_client", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "runtime dos contratos não importa o kit de testes"
type = "forbidden"
source_modules = [
    "axon_ai_contracts._freeze",
    "axon_ai_contracts._version",
    "axon_ai_contracts.compat",
    "axon_ai_contracts.declaration",
    "axon_ai_contracts.deprecation",
    "axon_ai_contracts.llm",
    "axon_ai_contracts.mcp",
    "axon_ai_contracts.pack",
    "axon_ai_contracts.retrieval",
    "axon_ai_contracts.tools",
