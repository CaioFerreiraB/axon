# Raiz virtual do uv workspace `ai-core` (ADR-004): contracts, core e generic.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# O pack genérico entra como dependência de desenvolvimento: o teste de carga real roda na suíte do core (010 R8).
ai-generic = { workspace = true }

[dependency-groups]
dev = [
    "ai-generic",
    # Cliente de teste do framework HTTP (spec 008): a suíte exercita a app em processo, sem abrir porta.
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "packaging>=24",
    "import-linter>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "packages/core/tests", "packages/generic/tests"]
pythonpath = [
    "packages/contracts/tests",
    "packages/core/tests/packs",
    "packages/core/tests/observability",
    "packages/core/tests/llm",
    "packages/core/tests/graph",
    "packages/core/tests/http",
    "packages/core/tests/bootstrap",
    "packages/core/tests/assistants",
    "packages/core/tests/mcp",
    "packages/core/tests/capabilities",
]
asyncio_mode = "auto"
# Spec 007: uma marca por user story, para rodar `-k us1` … `-k us6` (tasks.md, "Independent Test").
markers = [
    "us1: 007 US1 — MCP global sem código nem restart",
    "us2: 007 US2 — credencial por referência",
    "us3: 007 US3 — cliente restrito ao grant",
    "us4: 007 US4 — MCPs de usuário",
    "us5: 007 US5 — política por servidor",
    "us6: 007 US6 — proteções de rede",
]
asyncio_default_fixture_loop_scope = "function"
# estende os padrões do pytest; o pack de teste (fixtures/) roda no próprio ambiente limpo
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ai_core_contracts", "contract_test_pack", "ai_core", "ai_generic"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/contracts/src", "packages/contracts/tools", "packages/core/src", "packages/generic/src"]

[tool.importlinter]
root_packages = ["ai_core_contracts", "ai_core", "ai_generic"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contratos não dependem de frameworks do runtime"
type = "forbidden"
source_modules = ["ai_core_contracts"]
forbidden_modules = ["langgraph", "langchain", "fastapi", "qdrant_client", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "runtime dos contratos não importa o kit de testes"
type = "forbidden"
source_modules = [
    "ai_core_contracts._freeze",
    "ai_core_contracts._version",
    "ai_core_contracts.compat",
    "ai_core_contracts.declaration",
    "ai_core_contracts.deprecation",
    "ai_core_contracts.llm",
    "ai_core_contracts.mcp",
    "ai_core_contracts.pack",
    "ai_core_contracts.retrieval",
    "ai_core_contracts.tools",
    "ai_core_contracts.validation",
    "ai_core_contracts.view",
]
forbidden_modules = ["ai_core_contracts.testing"]

[[tool.importlinter.contracts]]
