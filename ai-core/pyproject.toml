# Raiz virtual do uv workspace `ai-core` (ADR-004): contracts, core e generic.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# O pack genérico entra como dependência de desenvolvimento: o teste de carga real roda na suíte do core (010 R8).
ai-generic = { workspace = true }

[dependency-groups]
dev = [
    "ai-generic",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "packaging>=24",
    "import-linter>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "packages/core/tests", "packages/generic/tests"]
pythonpath = [
    "packages/contracts/tests",
    "packages/core/tests/packs",
    "packages/core/tests/observability",
    "packages/core/tests/llm",
    "packages/core/tests/graph",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# estende os padrões do pytest; o pack de teste (fixtures/) roda no próprio ambiente limpo
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ai_core_contracts", "contract_test_pack", "ai_core", "ai_generic"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/contracts/src", "packages/contracts/tools", "packages/core/src", "packages/generic/src"]

[tool.importlinter]
root_packages = ["ai_core_contracts", "ai_core", "ai_generic"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contratos não dependem de frameworks do runtime"
type = "forbidden"
source_modules = ["ai_core_contracts"]
forbidden_modules = ["langgraph", "langchain", "fastapi", "qdrant_client", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "runtime dos contratos não importa o kit de testes"
type = "forbidden"
source_modules = [
    "ai_core_contracts._freeze",
    "ai_core_contracts._version",
    "ai_core_contracts.compat",
    "ai_core_contracts.declaration",
    "ai_core_contracts.deprecation",
    "ai_core_contracts.llm",
    "ai_core_contracts.mcp",
    "ai_core_contracts.pack",
    "ai_core_contracts.retrieval",
    "ai_core_contracts.tools",
    "ai_core_contracts.validation",
    "ai_core_contracts.view",
]
forbidden_modules = ["ai_core_contracts.testing"]

[[tool.importlinter.contracts]]
name = "contratos não importam o core"
type = "forbidden"
source_modules = ["ai_core_contracts"]
forbidden_modules = ["ai_core"]

[[tool.importlinter.contracts]]
name = "api.py do trace não importa o resto do módulo"
type = "forbidden"
source_modules = ["ai_core.observability.api"]
forbidden_modules = [
    "ai_core.observability.domain",
    "ai_core.observability.ports",
    "ai_core.observability.service",
    "ai_core.observability.adapters",
]

[[tool.importlinter.contracts]]
name = "domain do trace não importa portas, service nem adapters"
type = "forbidden"
source_modules = ["ai_core.observability.domain"]
forbidden_modules = [
    "ai_core.observability.ports",
    "ai_core.observability.service",
    "ai_core.observability.adapters",
]

[[tool.importlinter.contracts]]
name = "service do trace não importa adapters"
type = "forbidden"
source_modules = ["ai_core.observability.service"]
forbidden_modules = ["ai_core.observability.adapters"]

# Mantém executável a decisão da 009 (research R1): o seam é contrato próprio, e biblioteca de observabilidade só
# poderia aparecer num adapter.
[[tool.importlinter.contracts]]
name = "o núcleo do trace não importa biblioteca de observabilidade"
type = "forbidden"
source_modules = [
    "ai_core.observability.api",
    "ai_core.observability.domain",
    "ai_core.observability.ports",
    "ai_core.observability.service",
]
forbidden_modules = ["opentelemetry", "logfire", "sentry_sdk"]

[[tool.importlinter.contracts]]
name = "o trace não importa outros módulos do core"
type = "forbidden"
source_modules = ["ai_core.observability"]
forbidden_modules = ["ai_core.packs", "ai_core.llm"]

[[tool.importlinter.contracts]]
name = "api.py do Model Router não importa o resto do módulo"
type = "forbidden"
source_modules = ["ai_core.llm.api"]
forbidden_modules = ["ai_core.llm.domain", "ai_core.llm.ports", "ai_core.llm.service", "ai_core.llm.adapters"]

[[tool.importlinter.contracts]]
name = "domain do Model Router não importa portas, service nem adapters"
type = "forbidden"
source_modules = ["ai_core.llm.domain"]
forbidden_modules = ["ai_core.llm.ports", "ai_core.llm.service", "ai_core.llm.adapters"]

[[tool.importlinter.contracts]]
name = "service do Model Router não importa adapters"
type = "forbidden"
source_modules = ["ai_core.llm.service"]
forbidden_modules = ["ai_core.llm.adapters"]

# Torna executável a decisão da 006 (research R4): o SDK do provedor e o cliente HTTP só existem em adapters/.
[[tool.importlinter.contracts]]
name = "o núcleo do Model Router não importa SDK de provedor nem cliente HTTP"
type = "forbidden"
source_modules = [
    "ai_core.llm.api",
    "ai_core.llm.domain",
    "ai_core.llm.ports",
    "ai_core.llm.service",
]
forbidden_modules = ["openai", "httpx", "httpx2"]

[[tool.importlinter.contracts]]
name = "o Model Router só enxerga outros módulos pelo api.py"
type = "forbidden"
source_modules = ["ai_core.llm"]
forbidden_modules = [
    "ai_core.packs",
    "ai_core.observability.domain",
    "ai_core.observability.ports",
    "ai_core.observability.service",
    "ai_core.observability.adapters",
]

[[tool.importlinter.contracts]]
name = "api.py do motor não importa o resto do módulo"
type = "forbidden"
source_modules = ["ai_core.graph.api"]
forbidden_modules = [
    "ai_core.graph.domain",
    "ai_core.graph.ports",
    "ai_core.graph.service",
    "ai_core.graph.adapters",
]

[[tool.importlinter.contracts]]
name = "domain do motor não importa portas, service nem adapters"
type = "forbidden"
source_modules = ["ai_core.graph.domain"]
forbidden_modules = ["ai_core.graph.ports", "ai_core.graph.service", "ai_core.graph.adapters"]

[[tool.importlinter.contracts]]
name = "service do motor não importa adapters"
type = "forbidden"
source_modules = ["ai_core.graph.service"]
forbidden_modules = ["ai_core.graph.adapters"]

# A promessa central do ADR-011 e do SC-001: o framework de grafo não é contrato. Ele existe num pacote só, que pode
# ser jogado fora inteiro sem que api.py, domain/, ports.py e service.py — nem qualquer outro módulo — percebam.
[[tool.importlinter.contracts]]
name = "o framework de grafo só existe no adapter do motor"
type = "forbidden"
source_modules = [
    "ai_core.graph.api",
    "ai_core.graph.domain",
    "ai_core.graph.ports",
    "ai_core.graph.service",
    "ai_core.graph.adapters.clock",
    "ai_core.packs",
    "ai_core.llm",
    "ai_core.observability",
]
forbidden_modules = ["langgraph", "langchain_core"]

[[tool.importlinter.contracts]]
name = "o motor só enxerga outros módulos pelo api.py"
type = "forbidden"
source_modules = ["ai_core.graph"]
forbidden_modules = [
    "ai_core.packs.domain",
    "ai_core.packs.ports",
    "ai_core.packs.service",
    "ai_core.packs.adapters",
    "ai_core.llm.domain",
    "ai_core.llm.ports",
    "ai_core.llm.service",
    "ai_core.llm.adapters",
    "ai_core.observability.domain",
    "ai_core.observability.ports",
    "ai_core.observability.service",
    "ai_core.observability.adapters",
]

[[tool.importlinter.contracts]]
name = "o pack genérico não importa o core"
type = "forbidden"
source_modules = ["ai_generic"]
forbidden_modules = ["ai_core"]

[[tool.importlinter.contracts]]
name = "o core não importa o pack genérico"
type = "forbidden"
source_modules = ["ai_core"]
forbidden_modules = ["ai_generic"]

[[tool.importlinter.contracts]]
name = "o pack genérico não importa frameworks de infraestrutura"
type = "forbidden"
source_modules = ["ai_generic"]
forbidden_modules = ["yaml", "jsonschema", "fastapi", "langgraph", "langchain", "qdrant_client", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "api.py do Pack Runtime não importa o resto do módulo"
type = "forbidden"
source_modules = ["ai_core.packs.api"]
forbidden_modules = ["ai_core.packs.domain", "ai_core.packs.ports", "ai_core.packs.service", "ai_core.packs.adapters"]

[[tool.importlinter.contracts]]
name = "domain do Pack Runtime não importa portas, service nem adapters"
type = "forbidden"
source_modules = ["ai_core.packs.domain"]
forbidden_modules = ["ai_core.packs.ports", "ai_core.packs.service", "ai_core.packs.adapters"]

[[tool.importlinter.contracts]]
name = "service do Pack Runtime não importa adapters"
type = "forbidden"
source_modules = ["ai_core.packs.service"]
forbidden_modules = ["ai_core.packs.adapters"]

[[tool.importlinter.contracts]]
name = "infraestrutura só nos adapters do Pack Runtime"
type = "forbidden"
source_modules = ["ai_core.packs.api", "ai_core.packs.domain", "ai_core.packs.ports", "ai_core.packs.service"]
forbidden_modules = ["yaml"]
