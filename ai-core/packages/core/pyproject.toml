[project]
name = "ai-core"
version = "0.1.0"
description = "Runtime genérico da plataforma Agentic AI (monolito modular; specs 002–009, 011)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ai-core-contracts",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    # Spec 006 (research R4): camada compatível com OpenAI, confinada a ai_core/llm/adapters/ por import-linter.
    "openai>=3.15,<4",
    # Spec 005 (research R1): framework de grafo, confinado a ai_core/graph/adapters/langgraph/ por import-linter.
    "langgraph>=1.2,<2",
]

[tool.uv.sources]
ai-core-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
